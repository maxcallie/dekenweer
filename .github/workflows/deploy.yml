# Bouwt de app als web-app en zet hem online via GitHub Pages.
# Draait automatisch bij elke wijziging, of handmatig via het tabblad "Actions".
name: Web-app bouwen en publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pakketten ophalen
        run: flutter pub get

      - name: Tests
        run: flutter test
        # Een falende test houdt de web-app niet tegen (wel zichtbaar in het log).
        continue-on-error: true

      - name: Web-app bouwen
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --no-web-resources-cdn

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
