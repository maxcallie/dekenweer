<!DOCTYPE html>
<html lang="nl">
<head>
  <!-- Wordt bij het bouwen vervangen door de waarde van --base-href. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Zie je paarden grazen en krijg dekenadvies op basis van de weersvoorspelling.">
  <meta name="theme-color" content="#F6F1E7">

  <!-- iPhone / iPad: als app op het beginscherm -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dekenweer">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Dekenweer</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F6F1E7; overscroll-behavior: none; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(#CDEBF7 0 58%, #8CC26B 58% 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1F2A22; transition: opacity .4s ease;
    }
    #splash img { width: 112px; height: 112px; border-radius: 26px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    #splash p { margin: 0; font-weight: 700; font-size: 17px; }
    #splash .bar { width: 120px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.6); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      background: #2E6B3F; border-radius: 3px; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <p>Dekenweer</p>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
